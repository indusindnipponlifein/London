<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Training Convention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#0F2A4A;
  --navy-night:#050D1A;
  --red-signal:#C8102E;
  --red-error:#FF6E7C;
  --ink:#10202E;
  --white:#FFFFFF;
  --success:#3FDC9B;
  --gold-deep:#B8862E;
  --gold:#E3B54F;
  --gold-light:#F6DFA0;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  --font-display:'Cinzel', Georgia, serif;

  /* ==========================================================
     POSTER BACKGROUND — this is the only line you need to touch.
     Right now it points at the local file sitting next to this
     HTML file. Once you have your final hosted image link, just
     replace the url() below with it, e.g.:
     --hero-bg-image: url('https://yourdomain.com/poster.jpg');
     ========================================================== */
  --hero-bg-image: url('https://i.postimg.cc/HWPtczhy/Chat-GPT-Image-Sep-6-2026-01-31-02-AM.png');
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}

/* ---- The poster IS the page background — full-bleed, edge to edge,
   nothing else behind it. background-attachment:fixed keeps it
   filling the viewport at every scroll position, so there is never
   a strip of plain colour showing above/below/beside it. ---- */
body{
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
  font-family:var(--font-body);
  background-image:var(--hero-bg-image);
  background-size:contain;
  background-position:top center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  background-color:var(--navy-night); /* matches the image's own edge tone, so any letterboxing is invisible */
}

/* a soft vignette ON the poster (not a second background) purely to
   keep the gold text and glass card readable against the artwork */
.bg-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(2,5,9,.22) 0%, rgba(2,5,9,0) 22%, rgba(2,5,9,0) 62%, rgba(2,5,9,.5) 100%);
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* celebratory confetti, one burst on load */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
.confetti span{position:absolute;top:-8%;width:7px;height:13px;opacity:0;border-radius:1px;animation:confettiFall 3.4s ease-in forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}85%{opacity:1;}100%{transform:translateY(72vh) rotate(340deg);opacity:0;}}
.confetti span:nth-child(1){left:6%;background:var(--red-signal);animation-delay:.10s;}
.confetti span:nth-child(2){left:14%;background:var(--white);animation-delay:.50s;}
.confetti span:nth-child(3){left:22%;background:#9FB3C8;animation-delay:.15s;}
.confetti span:nth-child(4){left:30%;background:var(--white);animation-delay:.65s;}
.confetti span:nth-child(5){left:38%;background:var(--red-signal);animation-delay:.30s;}
.confetti span:nth-child(6){left:46%;background:var(--white);animation-delay:.05s;}
.confetti span:nth-child(7){left:54%;background:#9FB3C8;animation-delay:.45s;}
.confetti span:nth-child(8){left:62%;background:var(--white);animation-delay:.20s;}
.confetti span:nth-child(9){left:70%;background:var(--red-signal);animation-delay:.55s;}
.confetti span:nth-child(10){left:78%;background:var(--white);animation-delay:.35s;}
.confetti span:nth-child(11){left:86%;background:#9FB3C8;animation-delay:.10s;}
.confetti span:nth-child(12){left:94%;background:var(--white);animation-delay:.50s;}
.confetti span:nth-child(13){left:50%;background:var(--red-signal);animation-delay:.60s;}
.confetti span:nth-child(14){left:18%;background:var(--white);animation-delay:.40s;}

/* ---- CONTENT — everything sits in one column over the fixed poster,
   starting right where the artwork's own "CONVENTION NOVEMBER 2026"
   line ends and flowing down from there: countdown, subcopy, the
   glass entry card (input, button, results, downloads), and finally
   the closing line — all in the empty sky the poster was designed
   to leave open for exactly this. ---- */
.page{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:29vh 24px 48px;
  text-align:center;
}

.countdown{
  display:inline-flex;align-items:center;gap:9px;
  background:linear-gradient(135deg, rgba(200,16,46,.4), rgba(140,14,35,.5));
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  color:#fff;font-family:var(--font-display);font-weight:600;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;
  padding:10px 24px;border-radius:999px;border:1px solid rgba(227,181,79,.5);
  box-shadow:0 10px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);
  animation:rise .7s ease both;
}
.countdown::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--gold-light);box-shadow:0 0 8px 2px rgba(246,223,160,.8);
  flex-shrink:0;
}

.subcopy{
  font-family:var(--font-body);font-size:.95rem;line-height:1.6;color:var(--gold-light);
  max-width:340px;margin:16px auto 0;text-shadow:0 2px 10px rgba(2,5,9,.7);
  animation:rise .8s .1s ease both;
}

/* the entry card — a frosted glass panel, layered like real glass:
   a faint gradient sheen, blur, a soft gold edge, and a thin
   specular highlight along the top so it reads as premium, not just
   "translucent rectangle" */
.card{
  position:relative;z-index:1;width:100%;
  background:
    linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 35%, transparent 60%),
    linear-gradient(180deg, rgba(17,36,60,.5), rgba(6,14,26,.72));
  backdrop-filter:blur(24px) saturate(170%);
  -webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid rgba(227,181,79,.35);
  border-radius:24px;
  padding:30px 26px;
  margin:22px auto 0;max-width:360px;text-align:center;
  box-shadow:0 28px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.25);
  animation:rise .9s .2s ease both;
}
.card::before{
  content:"";position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
}
.badge{
  position:absolute;top:-18px;right:-14px;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg, rgba(200,16,46,.85), rgba(140,14,35,.9));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1.5px solid rgba(227,181,79,.65);display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:0 8px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
  animation:badgeIn .5s .8s cubic-bezier(.34,1.56,.64,1) both;
  cursor:pointer;appearance:none;-webkit-appearance:none;padding:0;
  transition:transform .15s ease;
}
.badge::after{content:none;}
.badge:hover{transform:scale(1.08);}
.badge:active{transform:scale(.94);}
@keyframes badgeIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* a small glass toast that pops up when the badge is tapped */
.toast{
  position:fixed;left:50%;top:13%;transform:translate(-50%,-8px);
  z-index:60;pointer-events:none;white-space:nowrap;
  background:linear-gradient(135deg, rgba(15,32,54,.8), rgba(6,14,26,.88));
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(227,181,79,.4);border-radius:999px;
  padding:10px 20px;color:var(--gold-light);
  font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 14px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  opacity:0;transition:opacity .35s ease, transform .35s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.input-wrap{
  padding:1.5px;border-radius:14px;margin-bottom:16px;
  background:linear-gradient(135deg, rgba(227,181,79,.85), rgba(184,134,46,.35), rgba(227,181,79,.85));
}
input{
  display:block;width:100%;padding:14px 16px;font-size:16px;font-family:var(--font-body);color:var(--gold-light);
  border-radius:12px;border:none;outline:none;text-align:center;
  background:rgba(9,20,35,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:box-shadow .2s ease, background .2s ease;
}
input:focus{box-shadow:0 0 0 4px rgba(227,181,79,.22);background:rgba(9,20,35,.72);}
input::placeholder{color:rgba(246,223,160,.5);}

button{
  position:relative;overflow:hidden;
  width:100%;padding:15px;border:1px solid rgba(227,181,79,.55);border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg, rgba(15,42,74,.92), rgba(5,13,26,.96));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--gold-light);
  font-family:var(--font-body);font-weight:600;font-size:16px;letter-spacing:.03em;
  box-shadow:0 14px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .2s ease, box-shadow .2s ease;
}
button::after{
  content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(227,181,79,.35), transparent);
  transform:skewX(-20deg);transition:left .6s ease;
}
button:hover::after{left:130%;}
button:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(15,42,74,.5), inset 0 1px 0 rgba(255,255,255,.15);}
button:active{transform:translateY(0);}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
button:focus-visible, input:focus-visible{outline:2px solid var(--red-signal);outline-offset:2px;}

.loader{
  display:none;margin-top:16px;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);font-size:14px;color:var(--gold-light);opacity:.85;
}
.loader.show{display:flex;}
.spinner{
  width:14px;height:14px;border:2px solid rgba(227,181,79,.25);border-top-color:var(--gold);
  border-radius:50%;display:inline-block;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#msg{margin-top:14px;text-align:center;font-weight:600;font-family:var(--font-body);font-size:15px;min-height:0;}
.success{color:var(--success);}
.error{color:var(--red-error);}

/* the 4 pdf download buttons, revealed after a successful lookup */
.downloads{
  display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;
}
.downloads.show{display:grid;}
.dl-btn{
  display:block;text-align:center;padding:13px 8px;border-radius:12px;
  background:linear-gradient(135deg, rgba(227,181,79,.22), rgba(184,134,46,.12));
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  color:var(--gold-light);font-weight:600;font-size:13.5px;text-decoration:none;
  border:1px solid rgba(227,181,79,.4);
  box-shadow:0 8px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.dl-btn:hover{
  transform:translateY(-2px);
  background:linear-gradient(135deg, rgba(227,181,79,.34), rgba(184,134,46,.2));
  box-shadow:0 12px 24px rgba(184,134,46,.3), inset 0 1px 0 rgba(255,255,255,.2);
}

/* closing line — a true page footer. margin-top:auto pushes it to the
   bottom of .page's flex column: on short content it sits pinned to
   the bottom of the viewport, on tall content it settles at the very
   end of the scrollable page — either way, always the last thing on
   the page, never mid-card. */
.footer-note{
  margin-top:auto;
  display:inline-block;
  padding:11px 26px;
  background:linear-gradient(135deg, rgba(15,32,54,.4), rgba(6,14,26,.5));
  backdrop-filter:blur(12px) saturate(150%);
  -webkit-backdrop-filter:blur(12px) saturate(150%);
  border:1px solid rgba(227,181,79,.3);
  border-radius:999px;
  font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.03em;
  color:var(--gold-light);
  box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
}

@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

/* general announcement popup - opens automatically on page load,
   closed via the Cancel button (or by tapping the dark background) */
.popup-overlay{
  display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;
  background:rgba(2,5,9,.78);padding:20px;
}
.popup-overlay.show{display:flex;}
.popup-box{
  background:#fff;border-radius:16px;padding:18px;max-width:480px;width:100%;
  max-height:85vh;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}
.popup-box iframe{
  width:100%;height:55vh;border:none;border-radius:10px;background:#f2f2f2;
}
.popup-cancel{
  align-self:center;padding:10px 30px;border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg, var(--navy-deep), #08182B);color:var(--gold-light);
  font-family:var(--font-body);font-weight:600;font-size:15px;
}
.popup-cancel:hover{opacity:.92;}

@media (max-width:480px){
  .page{padding-top:27vh;}
  .card{padding:24px 20px;}
  .popup-box iframe{height:48vh;}
}

@media (max-height:700px){
  .page{padding-top:22vh;}
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="bg-overlay" aria-hidden="true"></div>

<div class="confetti" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<h1 class="sr-only">London Training Convention — November 2026 — IndusInd Nippon Life</h1>

<div class="toast" id="toast" aria-live="polite"></div>

<main class="page">
  <div class="countdown" id="countdown">Loading countdown...</div>
  <p class="subcopy">Enter your details below to view your personalised experience</p>

  <section class="card">
    <button type="button" class="badge" id="celebrateBadge" aria-label="Tap for a surprise" onclick="celebrateBadge(event)">🎉</button>

    <div class="input-wrap">
      <input
        id="input"
        placeholder="Employee ID / Mobile No."
        autocomplete="off"
      >
    </div>
    <button onclick="searchDoc()" id="btn">Click to view &amp; download!</button>

    <div class="loader" id="loader"><span class="spinner"></span><span>Searching...</span></div>
    <div id="msg"></div>

    <div class="downloads" id="downloads">
      <a class="dl-btn" id="dl1" href="#" target="_blank" rel="noopener">Document 1</a>
      <a class="dl-btn" id="dl2" href="#" target="_blank" rel="noopener">Document 2</a>
      <a class="dl-btn" id="dl3" href="#" target="_blank" rel="noopener">Document 3</a>
      <a class="dl-btn" id="dl4" href="#" target="_blank" rel="noopener">Document 4</a>
    </div>
  </section>

  <p class="footer-note">🎉 See you in London!</p>
</main>

<div class="popup-overlay" id="popupOverlay" onclick="if(event.target===this)closePopup()">
  <div class="popup-box">
    <iframe id="popupFrame" src="" title="Notice"></iframe>
    <button class="popup-cancel" onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyEda91TPI9tNMYizYfTcgnRpNb1UvSzMyWfbdHIIhBW8OLQ6oUz-AMrZizOXPbxn8/exec";

// TODO: confirm this against the poster (it currently reads November 2026)
const CONVENTION_DATE=new Date("2026-09-20T00:00:00");

function getDaysRemaining(){
  const now=new Date();
  const diffMs=CONVENTION_DATE-now;
  return Math.ceil(diffMs/(1000*60*60*24));
}

function updateCountdown(){
  const el=document.getElementById("countdown");
  const days=getDaysRemaining();
  if(days>1){
    el.textContent=days+" Days To Go";
  }else if(days===1){
    el.textContent="1 Day To Go";
  }else if(days===0){
    el.textContent="Today's The Day";
  }else{
    el.textContent="See You In London";
  }
}

function closePopup(){
  document.getElementById("popupOverlay").classList.remove("show");
  document.getElementById("popupFrame").src="";
}

async function showGeneralPopup(){
  try{
    const response=await fetch(API_URL+"?action=popup");
    const data=await response.json();
    if(data.status==="success" && data.popup){
      document.getElementById("popupFrame").src=data.popup;
      document.getElementById("popupOverlay").classList.add("show");
    }
  }catch(err){
    // don't block the page if the announcement can't be fetched
  }
}

async function searchDoc(){
  const value=document.getElementById("input").value.trim();
  const msg=document.getElementById("msg");
  const loader=document.getElementById("loader");
  const btn=document.getElementById("btn");
  const downloads=document.getElementById("downloads");
  msg.innerHTML="";
  downloads.classList.remove("show");

  if(value===""){
    msg.className="error";
    msg.innerHTML="Please enter your Employee ID or Mobile Number.";
    return;
  }

  loader.classList.add("show");
  btn.disabled=true;

  try{
    const response=await fetch(API_URL+"?input="+encodeURIComponent(value));
    const data=await response.json();
    loader.classList.remove("show");
    btn.disabled=false;

    if(data.status==="success"){
      msg.className="success";
      msg.innerHTML="Details found! Your files are ready below.";

      document.getElementById("dl1").href=data.f1;
      document.getElementById("dl2").href=data.f2;
      document.getElementById("dl3").href=data.f3;
      document.getElementById("dl4").href=data.f4;
      downloads.classList.add("show");
    }else{
      msg.className="error";
      msg.innerHTML=data.message;
    }
  }catch(err){
    loader.classList.remove("show");
    btn.disabled=false;
    msg.className="error";
    msg.innerHTML="Unable to connect to server.";
  }
}

window.addEventListener("DOMContentLoaded", function(){
  updateCountdown();
  showGeneralPopup();
});

/* ---- Badge interaction: tapping the party badge fills the whole
   screen with confetti, gives the badge a playful wiggle, and
   surfaces a short rotating message. The message pool depends on
   where "today" sits relative to the convention date, so it keeps
   making sense before, on, and after the day itself. ---- */
const messagesUpcoming=[
  "🎊 Can't wait to see you in London!",
  "✨ Big Ben is counting the days too",
  "🥂 London, we're almost there!",
  "🎆 See you under the lights!"
];
const messagesTomorrow=[
  "🎉 One more sleep till London!",
  "🧳 Bags packed? Tomorrow's the day!",
  "✈️ Almost wheels up for London!"
];
const messagesToday=[
  "🎆 Today's the day — see you in London!",
  "🥳 It's happening! London, here we come!",
  "🕰️ Big Ben's ready — are you?"
];
const messagesPast=[
  "🎉 Hope London was unforgettable!",
  "📸 Thanks for making it a night to remember!",
  "🥂 Until the next convention — cheers!"
];

function pickBadgeMessage(){
  const days=getDaysRemaining();
  let pool;
  if(days>1) pool=messagesUpcoming;
  else if(days===1) pool=messagesTomorrow;
  else if(days===0) pool=messagesToday;
  else pool=messagesPast;
  return pool[Math.floor(Math.random()*pool.length)];
}

let toastTimer=null;

/* Fills the entire viewport: pieces start above the top edge at random
   x positions across the full width and fall past the bottom, each on
   its own staggered delay, so the burst reads as "the whole page" and
   not just a puff near the badge. */
function fireConfettiBurst(){
  const container=document.querySelector(".confetti");
  const colors=["var(--red-signal)","#fff","#9FB3C8","var(--gold-light)"];
  const w=window.innerWidth;
  const h=window.innerHeight;
  const count=40;
  for(let i=0;i<count;i++){
    const s=document.createElement("span");
    const startX=Math.random()*w;
    const startY=-30-Math.random()*160;
    const fallDist=h-startY+60+Math.random()*120;
    const drift=(Math.random()*2-1)*140;
    const rot=Math.random()*720-360;
    const delay=Math.random()*900;
    const size=6+Math.random()*4;
    s.style.position="absolute";
    s.style.left=startX+"px";
    s.style.top=startY+"px";
    s.style.width=size+"px";
    s.style.height=(size*1.8)+"px";
    s.style.borderRadius="1px";
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.opacity="0";
    container.appendChild(s);
    (function(span, dx, dy, r, d){
      setTimeout(function(){
        span.style.opacity="1";
        const anim=span.animate(
          [
            {transform:"translate(0,0) rotate(0deg)",opacity:1},
            {transform:"translate("+dx+"px,"+dy+"px) rotate("+r+"deg)",opacity:0}
          ],
          {duration:3200+Math.random()*1600,easing:"cubic-bezier(.3,.5,.4,1)"}
        );
        anim.onfinish=function(){ span.remove(); };
      }, d);
    })(s, drift, fallDist, rot, delay);
  }
}

function celebrateBadge(e){
  const badge=e.currentTarget;
  fireConfettiBurst();

  badge.animate(
    [
      {transform:"scale(1) rotate(0deg)"},
      {transform:"scale(1.3) rotate(-14deg)",offset:.3},
      {transform:"scale(.92) rotate(10deg)",offset:.6},
      {transform:"scale(1) rotate(0deg)"}
    ],
    {duration:550,easing:"ease-out"}
  );

  const toast=document.getElementById("toast");
  toast.textContent=pickBadgeMessage();
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toast.classList.remove("show"); },1800);
}
</script>
</body>
</html>
